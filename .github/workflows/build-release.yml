name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Restore release signing key
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/hotspot-file-server.jks
        run: |
          test -n "$ANDROID_SIGNING_KEY"
          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test, lint and build release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"

      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/hotspot-file-server.apk
          cd release
          sha256sum hotspot-file-server.apk > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: hotspot-file-server-apk
          path: |
            release/hotspot-file-server.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
